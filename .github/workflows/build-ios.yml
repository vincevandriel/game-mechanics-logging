name: Build and verify iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adventure-bar-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    name: XCTest and unsigned IPA
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Select a stable Xcode 26 installation
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="$(python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = []
          paths = list(Path("/Applications").glob("Xcode_26*.app"))
          paths.append(Path("/Applications/Xcode.app"))
          for path in paths:
              if not path.is_dir():
                  continue
              resolved = path.resolve()
              match = re.fullmatch(r"Xcode_(26)\.(\d+)(?:\.(\d+))?\.app", resolved.name)
              if match is None:
                  continue
              resolved_name = resolved.name.lower()
              if "beta" in resolved_name or "rc" in resolved_name:
                  continue
              version = tuple(int(part or 0) for part in match.groups())
              candidates.append((version, resolved))

          if candidates:
              print(max(candidates, key=lambda candidate: candidate[0])[1])
          PY
          )"
          if [[ -z "$XCODE_APP" || ! -d "$XCODE_APP" ]]; then
            echo "error: no stable versioned Xcode 26 installation was found" >&2
            exit 1
          fi
          sudo xcode-select --switch "$XCODE_APP/Contents/Developer"
          XCODE_VERSION_OUTPUT="$(xcodebuild -version)"
          if grep -Eiq '(^|[^[:alpha:]])(beta|rc)([^[:alpha:]]|$)|release candidate' <<< "$XCODE_VERSION_OUTPUT"; then
            echo "error: the selected Xcode reports a prerelease version" >&2
            printf '%s\n' "$XCODE_VERSION_OUTPUT" >&2
            exit 1
          fi
          XCODE_MAJOR="$(awk 'NR == 1 { split($2, value, "."); print value[1] }' <<< "$XCODE_VERSION_OUTPUT")"
          if [[ -z "$XCODE_MAJOR" || "$XCODE_MAJOR" -lt 26 ]]; then
            echo "error: Xcode 26 or newer is required" >&2
            exit 1
          fi
          printf '%s\n' "$XCODE_VERSION_OUTPUT"
          xcodebuild -showsdks

      - name: Validate project and Python companion tools
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -list -project AdventureBarEncounterLogger/AdventureBarEncounterLogger.xcodeproj
          python3 -m unittest -v tools.test_receiver tools.test_safari_logger

      - name: Select newest available iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list --json devices available > "$RUNNER_TEMP/simulators.json"
          SIMULATOR_UDID="$(python3 - "$RUNNER_TEMP/simulators.json" <<'PY'
          import json
          import re
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              devices_by_runtime = json.load(handle)["devices"]

          def runtime_version(identifier):
              match = re.search(r"\.iOS-(\d+(?:-\d+)*)$", identifier)
              if match is None:
                  return ()
              return tuple(int(part) for part in match.group(1).split("-"))

          runtimes = sorted(
              (runtime_version(identifier), identifier)
              for identifier in devices_by_runtime
              if runtime_version(identifier)
          )
          for _, identifier in reversed(runtimes):
              for device in devices_by_runtime[identifier]:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator was found")
          PY
          )"
          if [[ -z "$SIMULATOR_UDID" ]]; then
            echo "error: simulator selection returned an empty UDID" >&2
            exit 1
          fi
          echo "udid=$SIMULATOR_UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$SIMULATOR_UDID"

      - name: Build and run the complete XCTest suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/TestResults"
          xcrun simctl boot "${{ steps.simulator.outputs.udid }}"
          xcrun simctl bootstatus "${{ steps.simulator.outputs.udid }}" -b
          xcodebuild \
            -project AdventureBarEncounterLogger/AdventureBarEncounterLogger.xcodeproj \
            -scheme AdventureBarEncounterLogger \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/TestResults/AdventureBarEncounterLogger.xcresult" \
            clean test 2>&1 | tee "$RUNNER_TEMP/xcode-test.log"

      - name: Build and package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build_ipa.sh
          ./build_ipa.sh

      - name: Independently verify IPA structure
        shell: bash
        run: |
          set -euo pipefail
          IPA="dist/AdventureBarEncounterLogger.ipa"
          test -s "$IPA"
          unzip -t "$IPA"
          unzip -Z1 "$IPA" > "$RUNNER_TEMP/ipa-contents.txt"
          grep -Eq '^Payload/AdventureBarEncounterLogger\.app(/|$)' "$RUNNER_TEMP/ipa-contents.txt"
          grep -Fxq 'Payload/AdventureBarEncounterLogger.app/Info.plist' "$RUNNER_TEMP/ipa-contents.txt"
          shasum -a 256 "$IPA" | tee "dist/AdventureBarEncounterLogger.ipa.sha256"

      - name: Upload verified IPA
        uses: actions/upload-artifact@v4
        with:
          name: AdventureBarEncounterLogger-IPA
          path: |
            dist/AdventureBarEncounterLogger.ipa
            dist/AdventureBarEncounterLogger.ipa.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AdventureBarEncounterLogger-build-diagnostics
          path: |
            ${{ runner.temp }}/xcode-test.log
            ${{ runner.temp }}/TestResults
            ${{ runner.temp }}/ipa-contents.txt
          if-no-files-found: ignore
          retention-days: 14
